name: FMMods Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev/fmmods-branding
      - research/waenhancerx-migration
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.gitmodules'
      - '.github/workflows/fmmods-android.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build WhatsApp debug APK only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 21 for Gradle and KSP
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Configure sdkmanager and skip the retired "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: |
          # API 37 SDK is published as android-37.0, not android-37.
          sdkmanager --channel=3 --install "platforms;android-37.0" "cmake;3.22.1" "ndk;28.2.13676358"
          echo "Installed Android SDK platforms:"
          ls -1 "${ANDROID_HOME}/platforms"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build WhatsApp debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleWhatsappDebug
      - name: Upload test APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FMMods-WhatsApp-debug-apk
          path: app/build/outputs/apk/whatsapp/debug/*.apk
          if-no-files-found: error
          retention-days: 14
