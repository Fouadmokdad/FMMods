name: FMMods Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev/fmmods-branding
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.gitmodules'
      - '.github/workflows/fmmods-android.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build WhatsApp and Business debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Configure sdkmanager and skip the retired "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build both debug variants
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleWhatsappDebug :app:assembleBusinessDebug
      - name: Upload test APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FMMods-debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
