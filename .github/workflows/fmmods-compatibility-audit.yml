name: FMMods Compatibility Audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/waenhancerx-migration
    paths:
      - 'tools/check_whatsapp_compat.py'
      - 'tools/audit_feature_registry.py'
      - 'tests/test_whatsapp_compat.py'
      - 'app/src/main/res/**/arrays.xml'
      - '.github/workflows/fmmods-compatibility-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify declared WhatsApp support
        run: |
          python tools/check_whatsapp_compat.py --target whatsapp --version 2.26.46.10
      - name: Run compatibility unit tests
        run: python -m unittest discover -s tests -p 'test_whatsapp_compat.py' -v
      - name: Generate feature audit
        run: python tools/audit_feature_registry.py --version 2.26.46.10 --output feature-audit.md
      - name: Upload feature audit
        uses: actions/upload-artifact@v4
        with:
          name: FMMods-feature-audit
          path: feature-audit.md
          retention-days: 14
      - name: Check tool syntax
        run: python -m py_compile tools/check_whatsapp_compat.py tools/audit_feature_registry.py
