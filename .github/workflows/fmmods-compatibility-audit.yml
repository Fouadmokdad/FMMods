name: FMMods Compatibility Audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/waenhancerx-migration
    paths:
      - 'tools/check_whatsapp_compat.py'
      - 'app/src/main/res/**/arrays.xml'
      - '.github/workflows/fmmods-compatibility-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify declared WhatsApp support
        run: |
          python tools/check_whatsapp_compat.py --target whatsapp --version 2.26.46.10
          python tools/check_whatsapp_compat.py --target business --version 2.26.44.74
      - name: Check tool syntax
        run: python -m py_compile tools/check_whatsapp_compat.py
